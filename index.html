<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVON - Web Novels</title>
    <link rel="stylesheet" href="/style/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="site-header">
        <div class="brand-group">
            <div class="logo">
                <span>LEVON</span>
            </div>
            <p class="tagline">Web Novels for Everyone</p>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search novels, authors, genres..." oninput="renderNovels()">
        </div>
        
        <div class="toggle-container">
            <span class="toggle-label">Reading Mode</span>
            <label class="switch">
                <input type="checkbox" id="mode-toggle">
                <span class="slider round"></span>
            </label>
        </div>
    </header>

    <nav class="floating-nav">
        <a href="/" class="nav-item active">HOME</a>
        <a href="/pages/library.html" class="nav-item">LIBRARY</a>
        <a href="/pages/account.html" class="nav-item">ACCOUNT</a>
    </nav>

    <main class="content-container">
        <section class="tags-container">
            <button class="tag active" id="filter-popular" onclick="setFilter('popular')">Popular Novels</button>
            <button class="tag" id="filter-new" onclick="setFilter('new')">Newly Released</button>
            <button class="tag" id="filter-genre" onclick="setFilter('genre')">By Genre</button>
        </section>

        
        <div id="genre-pills" style="display: none; margin-top: 1rem; gap: 0.5rem; flex-wrap: wrap;"></div>

        <section class="content-grid" style="margin-top: 1.5rem;">
            <div class="content-placeholder">
                <p>Loading curated collection...</p>
            </div>
        </section>
    </main>

    <script src="/scripts/common.js"></script>
    <script src="/scripts/index.js"></script>
</body>
</html>
