<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVON - Library</title>
    <link rel="stylesheet" href="/style/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="site-header">
        <div class="brand-group">
            <div class="logo">
                <span>LEVON</span>
            </div>
            <p class="tagline">Web Novels for Everyone</p>
        </div>
        
        <div class="toggle-container">
            <span class="toggle-label">Reading Mode</span>
            <label class="switch">
                <input type="checkbox" id="mode-toggle">
                <span class="slider round"></span>
            </label>
        </div>
    </header>

    <nav class="floating-nav">
        <a href="/" class="nav-item">HOME</a>
        <a href="/pages/library.html" class="nav-item active">LIBRARY</a>
        <a href="/pages/account.html" class="nav-item">ACCOUNT</a>
    </nav>

    <main class="content-container">
        <section id="auth-gate" class="auth-card">
            <h2>Join LEVON</h2>
            <p>Create an account or log in to save your favorite web novels and track your reading progress.</p>
            <div class="auth-actions">
                <a href="/pages/auth.html" class="tag active" style="text-decoration: none; display: inline-block;">Log In</a>
                <a href="/pages/auth.html?mode=signup" class="tag" style="background: var(--nav-bg); text-decoration: none; display: inline-block;">Create Account</a>
            </div>
        </section>

        <section id="library-content" style="display: none;">
            <div class="section-title-container">
                <h2 class="page-title">Saved Novels</h2>
            </div>
            <div class="content-grid" id="saved-grid" style="margin-top: 1.5rem;">
                <div class="content-placeholder">
                    <p>Your saved shelf is empty. Explore books on the homepage!</p>
                </div>
            </div>
        </section>
    </main>

    <script src="/scripts/common.js"></script>
    <script src="/scripts/library.js"></script>
</body>
</html>
